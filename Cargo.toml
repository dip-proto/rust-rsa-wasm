[package]
name = "rsa-wasm-signatures"
version = "0.2.6"
edition = "2021"
include = ["/src/", "/benches/", "/build.rs", "/wasm-libs/librsa.a", "/wasm-libs/librsa_nowide.a", "/README.md", "/LICENSE"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/jedisct1/rust-rsa-wasm"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "RSA signing and signature verification for WebAssembly, using PKCS#1 v1.5 and SHA-256 (RS256)."
keywords = ["rsa", "signatures", "pkcs1", "wasm", "wasi"]
categories = ["cryptography", "wasm"]

[features]
default = []
# Link the archive built without the wasm wide-arithmetic proposal, for runtimes that do not implement it.
# Signing is ~2.4x slower but the module works everywhere.
no-wide-arithmetic = []

[dev-dependencies]
benchmark-simple = "0.1.11"

[[bench]]
name = "benchmark"
harness = false
