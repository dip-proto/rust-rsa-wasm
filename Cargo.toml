[package]
name = "rsa-wasm-signatures"
version = "0.1.0"
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/dip-proto/rust-rsa-wasm"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "RSA signing and signature verification for WebAssembly with WASI, using PKCS#1 v1.5 and SHA-256 (RS256)."
keywords = ["rsa", "signatures", "pkcs1", "wasm", "wasi"]
categories = ["cryptography", "wasm"]

[features]
default = []
# Link the archive built without the wasm wide-arithmetic proposal, for runtimes
# that do not implement it. Signing is ~2.4x slower but the module validates
# everywhere; no `-W wide-arithmetic=y` needed on the runtime side.
no-wide-arithmetic = []

[dev-dependencies]
benchmark-simple = "0.1.10"

[[bench]]
name = "benchmark"
harness = false
